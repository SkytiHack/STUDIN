name: Mobile Native Builds (iOS & Android)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - '.github/workflows/mobile-builds.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Kotlin Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: apps/android
        run: gradle assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STUDIN-Android-APK
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS App (SwiftUI)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build Unsigned iOS App
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project StudIn.xcodeproj \
            -scheme StudIn \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$PWD/build" \
            build

      - name: Package Unsigned IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/StudIn.app Payload/
          zip -r StudIn-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STUDIN-iOS-IPA
          path: apps/ios/StudIn-iOS-Unsigned.ipa
          retention-days: 30
